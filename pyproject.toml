[project]
name = "inside-the-game"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maina Murage", email = "muragevincent39@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.152.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
inside-the-game = "inside_the_game:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
